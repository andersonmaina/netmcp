[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netmcp"
version = "0.1.0"
description = "Safe Cisco and MikroTik router tooling for AI agents (CLI + MCP server), built on Netmiko"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["netmiko>=4.3", "pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
keyring = ["keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
netmcp = "netmcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real or lab devices (set NETMCP_LAB_* env vars)"]
addopts = "-m 'not integration'"
